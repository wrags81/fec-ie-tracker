name: Daily FEC refresh

on:
  schedule:
    # Target: 8:00 am Eastern. GitHub cron is UTC and scheduled runs often start hours
    # late, so several slots are listed and the gate below lets only the first one that
    # starts at or after 8 am Eastern refresh the data each day.
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
    - cron: "0 15 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

env:
  TZ: America/New_York

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Skip if before 8 am Eastern or already refreshed today
        id: gate
        run: |
          today=$(date +%F)
          last=$(git log -1 --format=%cd --date=format-local:%F -- output/data.json)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ "$(date +%H)" -ge 8 ] && [ "$last" != "$today" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: Eastern time is $(date +%R), data last refreshed $last"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
      - name: Pull, clean and render
        if: steps.gate.outputs.go == 'true'
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: |
          pip install -q -r requirements.txt
          python pull.py --refresh
          python build.py
          python report.py
      - name: Commit refreshed outputs
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          git diff --cached --quiet || git commit -m "Daily FEC refresh $(date +%F)"
          git pull --rebase origin main
          git push
