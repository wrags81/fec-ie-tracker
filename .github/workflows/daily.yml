name: Daily FEC refresh

on:
  schedule:
    # 8:00 am Eastern. GitHub cron is UTC, so run at both 12:00 and 13:00 UTC and
    # let the guard below keep whichever one is 8 am in New York (EDT or EST).
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Only run at 8 am Eastern
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=America/New_York date +%H)" = "08" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
      - name: Pull, clean and render
        if: steps.gate.outputs.go == 'true'
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: |
          pip install -q -r requirements.txt
          python pull.py --refresh
          python build.py
          python report.py
      - name: Commit refreshed outputs
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          git diff --cached --quiet || git commit -m "Daily FEC refresh $(TZ=America/New_York date +%F)"
          git push
